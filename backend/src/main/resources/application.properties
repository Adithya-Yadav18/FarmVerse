# --- Database Configuration ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/farmverse_db
spring.datasource.username=root
# CHANGE THIS to the password you created during MySQL installation:
spring.datasource.password=Adithya5724@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA & Hibernate Configuration ---
# 'update' means Hibernate will automatically create our tables in MySQL based on our Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server Port ---
# Running our backend on port 8080
server.port=8080